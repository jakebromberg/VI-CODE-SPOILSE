function b64ToBytes(b64) {
  const bin = atob(b64);
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}

function whenRuffleReady(cb) {
  if (window.RufflePlayer && typeof window.RufflePlayer.newest === "function") return cb();
  setTimeout(() => whenRuffleReady(cb), 50);
}

window.addEventListener("load", () => {
  whenRuffleReady(async () => {
    try {
      const ruffle = window.RufflePlayer.newest();
      const player = ruffle.createPlayer();
      const stage = document.getElementById("stage");
      stage.innerHTML = "";
      stage.appendChild(player);

      const bytes = b64ToBytes(SWF_BASE64);
      const blob = new Blob([bytes], { type: "application/x-shockwave-flash" });
      const url = URL.createObjectURL(blob);

      await player.ruffle().load({
        url: url,
        autoplay: "on",
        unmuteOverlay: "visible",
        letterbox: "on",
        scale: "showAll"
      });
    } catch (e) {
      const err = document.createElement("div");
      err.className = "err";
      err.textContent = "Failed to load Flash content: " + (e && e.message ? e.message : e);
      const stage = document.getElementById("stage");
      stage.innerHTML = "";
      stage.appendChild(err);
      console.error(e);
    }
  });
});
