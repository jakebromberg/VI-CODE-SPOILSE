<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>capture</title>
<style>
  html, body { margin: 0; padding: 0; background: #000; overflow: hidden; }
  #stage { position: fixed; left: 0; top: 0; width: 616px; height: 460px; background: #fff; }
  #stage > * { width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
<div id="stage"></div>
<script>
window.RufflePlayer = window.RufflePlayer || {};
window.RufflePlayer.config = {
  autoplay: "on",
  unmuteOverlay: "hidden",
  contextMenu: "off",
  warnOnUnsupportedContent: false,
  logLevel: "error",
  letterbox: "on",
  scale: "showAll",
  splashScreen: false,
  preferredRenderer: "wgpu"
};
</script>
<script src="ruffle/ruffle.js"></script>
<script>
function whenRuffleReady(cb) {
  if (window.RufflePlayer && typeof window.RufflePlayer.newest === "function") return cb();
  setTimeout(() => whenRuffleReady(cb), 50);
}
window.addEventListener("load", () => {
  whenRuffleReady(async () => {
    const ruffle = window.RufflePlayer.newest();
    const player = ruffle.createPlayer();
    const stage = document.getElementById("stage");
    stage.innerHTML = "";
    stage.appendChild(player);
    await player.ruffle().load({
      url: "conflashpin.swf",
      autoplay: "on",
      unmuteOverlay: "hidden",
      letterbox: "on",
      scale: "showAll",
      splashScreen: false
    });
  });
});
</script>
</body>
</html>
